# Dependabot configuration for automated dependency updates
version: 2

updates:
  # NuGet package updates for .NET projects
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "your-github-username" # Replace with actual username
    assignees:
      - "your-github-username" # Replace with actual username
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    milestone: null
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "Microsoft.WindowsAppSDK"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.UI.Xaml"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft-packages:
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "minor"
          - "patch"
      ui-packages:
        patterns:
          - "Microsoft.UI.*"
          - "Microsoft.WindowsAppSDK*"
        update-types:
          - "patch"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "your-github-username" # Replace with actual username
    assignees:
      - "your-github-username" # Replace with actual username
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "automated"
      - "ci-cd"
    allow:
      - dependency-type: "direct"
    groups:
      actions-updates:
        patterns:
          - "actions/*"
          - "microsoft/*"
          - "github/*"
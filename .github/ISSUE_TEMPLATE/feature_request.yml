name: 🚀 Feature Request
description: Suggest a new feature for AdvGen Offline Web Downloader
title: "[FEATURE] "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature! Please provide as much detail as possible to help us understand your request.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and feature requests to ensure this is not a duplicate
          required: true
        - label: I have considered whether this feature aligns with the project's goals
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A brief, clear description of the feature you'd like to see added.
      placeholder: "Add support for..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What use case does it address?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: "I would like to see..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe any alternative solutions or features you've considered.
      placeholder: "Alternatively, we could..."

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important is this feature to you?
      options:
        - "Nice to have"
        - "Would be helpful"
        - "Important for my workflow"
        - "Critical/blocking"
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Implementation Complexity (if known)
      description: If you have technical knowledge, how complex do you think this feature would be to implement?
      options:
        - "I don't know"
        - "Simple (UI change, configuration option)"
        - "Moderate (new functionality, API integration)"
        - "Complex (major architectural changes)"

  - type: textarea
    id: userbase
    attributes:
      label: User Impact
      description: Who would benefit from this feature? How many users do you think would use it?
      placeholder: "This would help users who..."

  - type: textarea
    id: mockup
    attributes:
      label: UI Mockup or Example
      description: |
        If this feature involves UI changes, please provide mockups, sketches, or examples from other applications.
        You can attach images by clicking this area to highlight it and then dragging files in.

  - type: textarea
    id: technical
    attributes:
      label: Technical Considerations
      description: |
        If you have technical knowledge, are there any specific implementation details, APIs, or technical challenges to consider?

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: |
        Add any other context, examples, or information about the feature request here.
        - Links to similar features in other applications
        - Research or documentation that supports this feature
        - Any constraints or requirements to consider
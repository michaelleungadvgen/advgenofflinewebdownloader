name: Security & Dependencies

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  push:
    branches: [ main ]
    paths:
      - '**/packages.config'
      - '**/*.csproj'
      - '**/packages.lock.json'
  pull_request:
    branches: [ main ]
    paths:
      - '**/packages.config'
      - '**/*.csproj'
      - '**/packages.lock.json'
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  dependency-analysis:
    name: Dependency Security Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: 📦 Restore Dependencies
      run: dotnet restore --verbosity minimal
      
    - name: 🔍 List Dependencies
      run: |
        echo "## NuGet Package Dependencies" >> $GITHUB_STEP_SUMMARY
        echo "| Package | Version | Vulnerabilities |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|---------|-----------------|" >> $GITHUB_STEP_SUMMARY
        
        # Extract package references from csproj files
        find . -name "*.csproj" -exec grep -H "PackageReference" {} \; | \
        sed 's/.*Include="\([^"]*\)".*Version="\([^"]*\)".*/|\1|\2|TBD|/' >> $GITHUB_STEP_SUMMARY || true
        
    - name: 🛡️ Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      env:
        JAVA_HOME: /opt/jdk
      with:
        project: 'AdvGenOfflineWebDownloader'
        path: '.'
        format: 'HTML,JSON,SARIF'
        args: >
          --enableRetired
          --enableExperimental
          --disableYarnAudit
          --disableNodeAudit
          --disableNodeJS
          --disablePyDist
          --disablePyPkg
          --disableRubygems
          --disableBundleAudit
          --disableCocoapodsAudit
          --disableSwiftAudit
          --disableGoMod
        
    - name: 📤 Upload Dependency Check Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-check-report
        path: reports/
        retention-days: 30
        
    - name: 📊 Upload SARIF Results
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: reports/dependency-check-report.sarif
        category: dependency-check
        
    - name: 🚨 Check for High/Critical Vulnerabilities
      if: always()
      run: |
        if [ -f reports/dependency-check-report.json ]; then
          CRITICAL=$(jq '.dependencies[].vulnerabilities[]? | select(.severity == "CRITICAL") | .name' reports/dependency-check-report.json | wc -l)
          HIGH=$(jq '.dependencies[].vulnerabilities[]? | select(.severity == "HIGH") | .name' reports/dependency-check-report.json | wc -l)
          
          echo "🔍 Security Scan Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Critical vulnerabilities: $CRITICAL" >> $GITHUB_STEP_SUMMARY
          echo "- High vulnerabilities: $HIGH" >> $GITHUB_STEP_SUMMARY
          
          if [ $CRITICAL -gt 0 ] || [ $HIGH -gt 0 ]; then
            echo "⚠️ High or critical vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            echo "Please review the dependency check report." >> $GITHUB_STEP_SUMMARY
            
            # Don't fail the build, but warn
            echo "::warning::Found $CRITICAL critical and $HIGH high severity vulnerabilities"
          else
            echo "✅ No critical or high severity vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "⚠️ Dependency check report not found" >> $GITHUB_STEP_SUMMARY
        fi

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    
    permissions:
      security-events: write
      actions: read
      contents: read
      
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🔧 Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        queries: +security-and-quality
        
    - name: 🏗️ Build for Analysis
      run: |
        # Simple build for analysis
        dotnet restore
        dotnet build --configuration Release --verbosity minimal
        
    - name: 🔍 Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:csharp"

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: 📦 Restore Dependencies
      run: dotnet restore
      
    - name: 📄 Check Licenses
      run: |
        echo "## License Compliance Report" >> $GITHUB_STEP_SUMMARY
        echo "Checking licenses of all NuGet dependencies..." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Install dotnet-project-licenses tool
        dotnet tool install --global dotnet-project-licenses || true
        
        # Generate license report
        if command -v dotnet-project-licenses &> /dev/null; then
          dotnet-project-licenses --input . --output-format table --export-license-texts --output licenses/
          
          if [ -f licenses/licenses.txt ]; then
            echo "### Dependencies and Licenses" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -50 licenses/licenses.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "⚠️ License analysis tool not available" >> $GITHUB_STEP_SUMMARY
        fi
        
    - name: 📤 Upload License Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: license-compliance-report
        path: licenses/
        retention-days: 30

  security-summary:
    name: Security Summary
    needs: [dependency-analysis, codeql-analysis, license-compliance]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📋 Generate Security Summary
      run: |
        echo "# 🛡️ Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "## Analysis Results" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        
        # Check job statuses
        if [ "${{ needs.dependency-analysis.result }}" = "success" ]; then
          echo "| Dependency Analysis | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| Dependency Analysis | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.codeql-analysis.result }}" = "success" ]; then
          echo "| CodeQL Analysis | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| CodeQL Analysis | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.license-compliance.result }}" = "success" ]; then
          echo "| License Compliance | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
        else
          echo "| License Compliance | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📝 Recommendations" >> $GITHUB_STEP_SUMMARY
        echo "- Review any security findings in the Security tab" >> $GITHUB_STEP_SUMMARY
        echo "- Check dependency vulnerabilities in the uploaded reports" >> $GITHUB_STEP_SUMMARY
        echo "- Ensure all dependencies use compatible licenses" >> $GITHUB_STEP_SUMMARY
        echo "- Keep dependencies up to date with security patches" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Security scan completed on $(date -u)*" >> $GITHUB_STEP_SUMMARY